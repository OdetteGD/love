name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'platform/**'
      - 'REVIVAL_ROADMAP.md'
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'platform/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Android build variant'
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android ${{ inputs.build_type || 'Debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'Debug' }}
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4G -Dorg.gradle.daemon=false'
    steps:
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build cmake

      - name: Checkout LÖVE Android shell
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: main
          path: android-app
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Checkout megasource dependencies
        uses: actions/checkout@v4
        with:
          repository: love2d/megasource
          ref: main
          path: android-app/app/src/main/cpp/megasource
          submodules: recursive

      - name: Checkout this LÖVE fork
        uses: actions/checkout@v4
        with:
          path: android-app/app/src/main/cpp/love
          submodules: recursive

      - name: Build Android APK
        working-directory: android-app
        run: ./gradlew --no-daemon assembleNormalRecord${BUILD_TYPE}

      - name: Upload debug APK
        if: env.BUILD_TYPE == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: love-android-debug-apk
          path: android-app/app/build/outputs/apk/normalRecord/debug/app-normal-record-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: env.BUILD_TYPE == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: love-android-release-unsigned-apk
          path: android-app/app/build/outputs/apk/normalRecord/release/app-normal-record-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            android-app/app/build/reports/
            android-app/app/.cxx/
            android-app/app/build/intermediates/cxx/
          if-no-files-found: ignore
          retention-days: 7
